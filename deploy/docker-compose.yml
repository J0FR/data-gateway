# Relay service next to the Postgres the dashboards already use.
# Put the real values in deploy/.env (never commit it).
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"          # put a TLS reverse proxy (Caddy/nginx) in front
    environment:
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL}          # postgresql+psycopg2://relay:***@host:5432/db
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN}            # 12+ chars; password for /admin
      RELAY_DASHBOARD_TOKEN: ${RELAY_DASHBOARD_TOKEN:-}  # lets dashboards call /api/refresh/<dataset>
      RELAY_SCHEMA: relay                                 # relay's own tables
      RELAY_DATA_SCHEMA: ${RELAY_DATA_SCHEMA:-public}     # where dashboard tables are published
